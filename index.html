<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy Bill – Cake Shop Billing &amp; Management Software</title>
    <meta
      name="description"
      content="Easy Bill is a modern cake shop POS billing and management system for walk-in billing, custom cake orders, inventory, expenses, and thermal receipt printing."
    />
    <meta property="og:title" content="Easy Bill – Cake Shop Billing &amp; Management Software" />
    <meta
      property="og:description"
      content="Smart Billing. Simple Business. Complete cake shop POS, order management, and analytics."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('easybill_color_theme');
          if (t && ['navy-teal', 'charcoal-orange', 'emerald-white', 'midnight-gold'].indexOf(t) !== -1) {
            document.documentElement.setAttribute('data-theme', t);
          } else {
            document.documentElement.setAttribute('data-theme', 'navy-teal');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--eb-bg)] text-[var(--eb-text)] font-normal antialiased selection:bg-[var(--eb-accent)]/20 selection:text-[var(--eb-text)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
