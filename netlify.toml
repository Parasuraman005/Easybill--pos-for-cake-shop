[build]
  command = "npm install --include=optional && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  external_node_modules = ["better-sqlite3", "express"]
  node_bundler = "esbuild"
  included_files = ["easybill.db"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
